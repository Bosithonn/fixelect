name: Build & Release Fixelect

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., v1.1.0). Leave empty to build without publishing.'
        required: false
        default: ''

permissions:
  contents: write

env:
  # UTF-8 output on every runner (the Windows console defaults to cp1252).
  PYTHONUTF8: '1'
  # v1.2.3 from a tag push or the manual input; empty for branch/PR builds.
  RELEASE_TAG: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  # ---------------------------------------------------------------------------
  # Model-free tests on all three platforms (guard rules, rich text, chunking,
  # language detection, polish styles). Every build depends on them.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard tests
        run: python tests/test_guard.py
      - name: Text tests
        run: python tests/test_text.py
      - name: Release tag matches the app version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          APP=$(python -c "import sys; sys.path.insert(0, 'shared'); import version; print(version.APP_VERSION)")
          [ "v$APP" = "$RELEASE_TAG" ] || { echo "Tag $RELEASE_TAG does not match shared/version.py ($APP)"; exit 1; }

  build-windows:
    name: Build Windows Installer (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Windows/requirements.txt'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          foreach ($d in "C:\Program Files (x86)\Inno Setup 6", "C:\Program Files (x86)\Inno Setup 7") {
            if (Test-Path $d) { $d | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Windows/requirements.txt

      - name: Build Windows executable with PyInstaller
        run: |
          cd Windows
          pyinstaller --clean Fixelect.spec -y

      - name: Smoke-test the frozen app
        run: |
          # A windowed exe has no console, so check that every module imports and it exits cleanly.
          $p = Start-Process -FilePath Windows/dist/Fixelect/Fixelect.exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Fixelect.exe --version exited with $($p.ExitCode)"; exit 1 }
          # The model download must verify HTTPS certificates from the frozen app.
          $p = Start-Process -FilePath Windows/dist/Fixelect/Fixelect.exe -ArgumentList "--check-https" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Fixelect.exe --check-https exited with $($p.ExitCode)"; exit 1 }

      # Code signing runs only when the repository has a certificate:
      #   WINDOWS_CERT_PFX (base64 of the .pfx) and WINDOWS_CERT_PASSWORD.
      - name: Prepare code signing
        id: sign
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) { "enabled=false" >> $env:GITHUB_OUTPUT; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } | Sort-Object FullName -Descending | Select-Object -First 1
          "enabled=true" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT
          "pfx=$pfx" >> $env:GITHUB_OUTPUT

      - name: Sign Fixelect.exe
        if: steps.sign.outputs.enabled == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & "${{ steps.sign.outputs.signtool }}" sign /f "${{ steps.sign.outputs.pfx }}" /p $env:CERT_PASSWORD `
            /fd sha256 /tr http://timestamp.digicert.com /td sha256 Windows/dist/Fixelect/Fixelect.exe

      - name: Compile Inno Setup installer
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          cd Windows
          $isccArgs = @()
          if ($env:RELEASE_TAG) { $isccArgs += "/DMyAppVersion=$($env:RELEASE_TAG.TrimStart('v'))" }
          if ("${{ steps.sign.outputs.enabled }}" -eq "true") {
            $isccArgs += "/DSIGN"
            $isccArgs += "/Sfixsign=`"${{ steps.sign.outputs.signtool }}`" sign /f `"${{ steps.sign.outputs.pfx }}`" /p $env:CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f"
          }
          iscc @isccArgs installer.iss

      - name: Checksum
        run: |
          if (-not (Test-Path "Windows/dist/FixelectSetup.exe")) { Write-Error "FixelectSetup.exe was not created!"; exit 1 }
          $h = (Get-FileHash Windows/dist/FixelectSetup.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path Windows/dist/FixelectSetup.exe.sha256 -Value $h -NoNewline -Encoding ascii
          Get-Item Windows/dist/FixelectSetup.exe | Select-Object Name, Length
          Write-Host "SHA-256 $h"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fixelect-Windows-Installer
          path: |
            Windows/dist/FixelectSetup.exe
            Windows/dist/FixelectSetup.exe.sha256
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG (.dmg)
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'MacOS/requirements.txt'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r MacOS/requirements.txt

      - name: macOS smoke test (source)
        run: python3 tests/mac_smoke.py

      # Signing + notarization run only when the repository has an Apple
      # Developer ID: MACOS_CERT_P12 (base64), MACOS_CERT_PASSWORD, DEVELOPER_ID,
      # APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "No certificate: ad-hoc build"; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KC_PASS=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build macOS app & DMG
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd MacOS
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - name: macOS smoke test (built app)
        run: python3 tests/mac_smoke.py MacOS/dist/Fixelect.app

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fixelect-macOS-DMG
          path: |
            MacOS/dist/Fixelect.dmg
            MacOS/dist/Fixelect.dmg.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "FixelectSetup.exe*" -o -name "Fixelect.dmg*" \) -exec cp {} release_assets/ \;
          ls -lh release_assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Fixelect ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          files: release_assets/*
          body: |
            ## Fixelect ${{ env.RELEASE_TAG }} — offline grammar fixes and polish in every app

            Fixelect fixes and polishes the text you select, in any app, with an AI model that runs entirely on your computer. No account, no cloud, no telemetry.

            ### Download
            - **Windows 10 / 11 (64-bit)**: `FixelectSetup.exe`
            - **macOS 11+ (Apple Silicon)**: `Fixelect.dmg`

            Each file has a `.sha256` checksum next to it. Fixelect's built-in updater verifies it automatically.

            **First launch:** if Windows shows "Windows protected your PC", click **More info → Run anyway**. On a Mac, if it says Fixelect can't be opened, go to **System Settings → Privacy & Security → Open Anyway**. Builds are signed automatically once the project has signing certificates.

            ### Highlights
            - **Fix** (double-tap Alt / ⌥) keeps your voice; **Polish** (double-tap Ctrl / ⌃) shows a preview with Professional, Friendly, Concise, Formal and Shorter styles.
            - An on-screen card shows progress and results, with one-click **Undo**.
            - Formatting (bold, links, fonts) is kept in Word, Outlook, Google Docs and Gmail.
            - English plus Spanish, French, German, Portuguese, Italian, Russian and Ukrainian. Uzbek (beta) with the optional Gemma 4 model.
            - Turn Fixelect off for specific apps; terminals and password managers are off by default.
            - Frees the model's memory when idle; long text is processed in chunks you can cancel with Esc.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
